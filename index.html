<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital clock</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="clock">
        <div class="hours">
            <p>Hours</p>
            <span id="hours">00</span>
            <span class="s">:</span>
        </div>
        <div class="min">
            <p>Minutes</p>
            <span id="minutes">00</span>
            <span class="s">:</span>
        </div>
         <div class="seconds">
            <p>Seconds</p>
            <span id="seconds">00</span>
            <span class="s">:</span>
        </div>
        <div class="ap">
            <p>AM/PM</p>
            <span id="ampm">AM</span>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
